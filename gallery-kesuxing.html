   <!-- 图片查看器（滑动手势放大缩小） -->
   <div id="viewer-overlay" style="display:none;position:fixed;inset:0;z-index:10000;background:rgba(0,0,0,0.85);align-items:center;justify-content:center;user-select:none;touch-action:none;">
     <span onclick="closeViewer()" style="position:absolute;top:16px;right:24px;font-size:2rem;color:#fff;cursor:pointer;z-index:10;">&times;</span>
     <span onclick="rotateImg()" style="position:absolute;bottom:24px;left:50%;transform:translateX(92px);font-size:1.2rem;color:#fff;cursor:pointer;background:rgba(255,255,255,0.15);width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;">↻</span>
     <div id="viewer-hint" style="display:none;position:absolute;bottom:80px;left:50%;transform:translateX(-50%);background:rgba(99,110,114,0.75);color:#fff;padding:10px 24px;border-radius:6px;font-size:0.85rem;z-index:20;pointer-events:none;">滑动可放大缩小</div>
     <img id="viewer-img" draggable="false" style="max-width:90vw;max-height:85vh;object-fit:contain;transition:transform 0.25s;cursor:grab;">
   </div>
   <script>
     var _scale = 1, _rotation = 0, _currentImg = null;
     var _touchStartX = 0, _touchStartY = 0, _vw = window.innerWidth, _vh = window.innerHeight;
     var _hintKey = 'viewer_hint_count';
 
     function openViewer(src) {
       _scale = 1; _rotation = 0; _vw = window.innerWidth; _vh = window.innerHeight;
       var img = document.getElementById('viewer-img');
       img.src = src;
       img.style.transform = 'scale('+_scale+') rotate('+_rotation+'deg)';
       document.getElementById('viewer-overlay').style.display = 'flex';
       // 操作提示：前3次显示
       var hintCount = parseInt(localStorage.getItem(_hintKey) || '0', 10);
       if (hintCount < 3) {
         var hint = document.getElementById('viewer-hint');
         hint.style.display = 'block';
         hint.style.opacity = '1';
         setTimeout(function() {
           hint.style.transition = 'opacity 0.6s';
           hint.style.opacity = '0';
           setTimeout(function() { hint.style.display = 'none'; hint.style.transition = ''; }, 600);
         }, 3000);
         localStorage.setItem(_hintKey, String(hintCount + 1));
       }
     }
     function closeViewer() { document.getElementById('viewer-overlay').style.display = 'none'; }
     function rotateImg() { _rotation = (_rotation + 90) % 360; updateTransform(); }
     function updateTransform() {
       document.getElementById('viewer-img').style.transform = 'scale('+_scale+') rotate('+_rotation+'deg)';
     }
     // 滑动手势检测
     var overlay = document.getElementById('viewer-overlay');
     overlay.addEventListener('touchstart', function(e) {
       var t = e.touches[0];
       _touchStartX = t.clientX;
       _touchStartY = t.clientY;
     }, {passive: true});
     overlay.addEventListener('touchend', function(e) {
       var t = e.changedTouches[0];
       var dx = t.clientX - _touchStartX;
       var dy = t.clientY - _touchStartY;
       var dist = Math.sqrt(dx*dx + dy*dy);
       if (dist < 20) return; // 忽略轻微移动
       var cx = _vw / 2, cy = _vh / 2;
       var startDist = Math.sqrt((_touchStartX-cx)*(_touchStartX-cx) + (_touchStartY-cy)*(_touchStartY-cy));
       var endDist = Math.sqrt((t.clientX-cx)*(t.clientX-cx) + (t.clientY-cy)*(t.clientY-cy));
       if (endDist > startDist + 15) { _scale = Math.min(_scale + 0.25, 3); updateTransform(); }
       else if (endDist < startDist - 15) { _scale = Math.max(_scale - 0.25, 0.25); updateTransform(); }
     }, {passive: true});
     // 鼠标拖动支持
     var _mouseDown = false, _mx = 0, _my = 0;
     overlay.addEventListener('mousedown', function(e) { if (e.target.id !== 'viewer-img') return; _mouseDown = true; _mx = e.clientX; _my = e.clientY; document.getElementById('viewer-img').style.cursor = 'grabbing'; });
     overlay.addEventListener('mouseup', function(e) {
       if (!_mouseDown) return; _mouseDown = false;
       document.getElementById('viewer-img').style.cursor = 'grab';
       var dx = e.clientX - _mx, dy = e.clientY - _my;
       var dist = Math.sqrt(dx*dx + dy*dy);
       if (dist < 20) return;
       var cx = _vw / 2, cy = _vh / 2;
       var startDist = Math.sqrt((_mx-cx)*(_mx-cx) + (_my-cy)*(_my-cy));
       var endDist = Math.sqrt((e.clientX-cx)*(e.clientX-cx) + (e.clientY-cy)*(e.clientY-cy));
       if (endDist > startDist + 15) { _scale = Math.min(_scale + 0.25, 3); updateTransform(); }
       else if (endDist < startDist - 15) { _scale = Math.max(_scale - 0.25, 0.25); updateTransform(); }
     });
     document.getElementById('viewer-overlay').addEventListener('click', function(e) {
       if (e.target === this) closeViewer();
     });
     document.addEventListener('keydown', function(e) {
       if (e.key === 'Escape') closeViewer();
     });
   </script>
   <script>
     (function(){
       var grid = document.getElementById('pmGrid');
       var total = 119;
       var prefix = 'assets/images/plastic-memories/pm-';
       for (var i = 1; i <= total; i++) {
         var pad = ('000' + i).slice(-3);
         var ext = (i === 47) ? 'png' : 'jpg';
         var div = document.createElement('div');
         div.style.cssText = 'border-radius:6px;overflow:hidden;aspect-ratio:1;border:1px solid #E0E0E0;background:#F5F5F5;';
         div.innerHTML = '<img src="'+prefix+pad+'.'+ext+'" style="width:100%;height:100%;object-fit:cover;display:block;cursor:pointer;" loading="lazy" onclick="openViewer(this.src)">';
         grid.appendChild(div);
       }
     })();
   </script>
