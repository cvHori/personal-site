     </div>
   </footer>
 
 <script>
 (function() {
   // ---- 创建粒子 ----
   function spawnParticles(container, count) {
     for (let i = 0; i < count; i++) {
       const p = document.createElement('div');
       p.className = 'velvet-particle';
       const x = 10 + Math.random() * 80; // %
       const y = 10 + Math.random() * 60; // %
       const delay = Math.random() * 1.2;
       const dur = 1.2 + Math.random() * 0.8;
       p.style.cssText = `left:${x}%;top:${y}%;animation:particle-float ${dur}s ${delay}s ease-out forwards;`;
       container.appendChild(p);
     }
   }
 
   // ---- 开门动画 ----
   function triggerVelvetDoor(targetUrl) {
     const overlay = document.createElement('div');
     overlay.className = 'velvet-overlay';
     overlay.innerHTML =
       '<div class="velvet-frame">' +
         '<div class="velvet-arch"></div>' +
         '<div class="velvet-door-l"></div>' +
         '<div class="velvet-door-r"></div>' +
         '<div class="velvet-glow"></div>' +
       '</div>';
     document.body.appendChild(overlay);
 
     // 强制回流后激活淡入
     requestAnimationFrame(function() {
       overlay.classList.add('active');
     });
 
     // 生成粒子
     spawnParticles(overlay.querySelector('.velvet-frame'), 18);
 
     // 0.6s 后开门
     setTimeout(function() {
       overlay.classList.add('door-open');
     }, 600);
 
     // 2s 后跳转
     setTimeout(function() {
       window.location.href = targetUrl;
     }, 2000);
   }
 
   // ---- 绑定瓷砖点击 ----
   var tiles = document.querySelectorAll('.home-tiles .tile');
   for (var i = 0; i < tiles.length; i++) {
     (function(tile) {
       tile.addEventListener('click', function(e) {
         e.preventDefault();
         var url = tile.getAttribute('data-page');
         // 文字淡出
         tile.classList.add('fade-out');
         // 触发开门动画
         triggerVelvetDoor(url);
       });
     })(tiles[i]);
   }
 })();
 </script>
 
 <script src="assets/detector.js"></script></body>
 </html>
